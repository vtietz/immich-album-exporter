name: reusable-e2e

on:
  workflow_call:

jobs:
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        immich-version: ["v3.1.0", "v2.7.5"]

    steps:
      - uses: actions/checkout@v5

      - name: Run end-to-end tests against Immich ${{ matrix.immich-version }}
        env:
          IMMICH_VERSION: ${{ matrix.immich-version }}
        run: |
          chmod +x ./run.sh
          ./run.sh test

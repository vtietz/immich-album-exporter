name: reusable-unit-test

on:
  workflow_call:

jobs:
  unit-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Run unit tests
        run: |
          chmod +x ./run.sh
          ./run.sh unit-test

      - name: Run unit tests against the runtime image
        run: ./run.sh image-test
